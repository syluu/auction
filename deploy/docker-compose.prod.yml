# Production, single host:  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro", "uploads:/var/www/uploads:ro"]
    depends_on: [web, api]
  web:
    build: { context: .., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_API_URL: "${PUBLIC_URL}" } }
    environment: { API_INTERNAL_URL: "http://api:4000", NEXT_PUBLIC_API_URL: "${PUBLIC_URL}" }
  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://auction:${PG_PASSWORD}@postgres:5432/auction
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      AUTH_MODE: password
      TRUST_PROXY: "true"
      WEB_ORIGIN: ${PUBLIC_URL}
      UPLOAD_DIR: /var/www/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes: ["uploads:/var/www/uploads"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: auction, POSTGRES_USER: auction, POSTGRES_PASSWORD: "${PG_PASSWORD}" }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
volumes: { pgdata: {}, uploads: {} }
