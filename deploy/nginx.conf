server {
  listen 80;
  client_max_body_size 10m;
  location /api/ { proxy_pass http://api:4000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /socket.io/ {
    proxy_pass http://api:4000/socket.io/;
    proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host;
  }
  location /uploads/ { alias /var/www/uploads/; expires 7d; }
  location / { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
