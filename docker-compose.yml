# Full stack, single host:  ./deploy.sh   (or: docker compose up -d --build)
# Settings come from ./.env  — copy .env.docker.example to .env or let deploy.sh generate it.
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      CADDY_SITE: ${CADDY_SITE:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/var/www/uploads:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "${PUBLIC_URL:-http://localhost}" }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost}
    depends_on:
      api: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://auction:${PG_PASSWORD:?set PG_PASSWORD in .env}@postgres:5432/auction
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AUTH_MODE: ${AUTH_MODE:-password}
      TRUST_PROXY: "true"
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost}
      UPLOAD_DIR: /var/www/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      AUTO_BID_DELAY_MS: ${AUTO_BID_DELAY_MS:-1000}
    volumes:
      - uploads:/var/www/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data: {}
  redis-data: {}
  uploads: {}
  caddy-data: {}
  caddy-config: {}
